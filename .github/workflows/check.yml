name: Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run HTMLHint
        run: |
          npx --yes htmlhint@1.1.4 \
            --config .htmlhintrc \
            "*.html"

  js:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
          echo "All JavaScript files passed."
